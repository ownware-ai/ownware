# The Ownware gateway wire contract — SSE event vocabulary, v1.
#
# Companion to openapi.yaml. Every frame on
# GET /api/v1/runs/{runId}/events is one JSON object
# carrying `type` and `seq`. `seq` is the resume cursor: reconnect with
# ?since=<highest seen> and the stream resumes without replaying.
#
# THE TERMINATION RULE (the one thing every consumer must know): the
# run-scoped stream closes after its bounded terminal event. One run's reply
# is finished at:
#   - turn.end whose stopReason is NOT tool_use / pause_turn, or
#   - turn.interrupted, error, or stream.shutdown.
# @ownware/client's streamReply() encodes exactly this.

asyncapi: 3.0.0
info:
  title: Ownware Gateway — run event stream
  version: 0.46.0

channels:
  runEvents:
    address: /api/v1/runs/{runId}/events
    messages:
      textDelta:
        name: text.delta
        summary: Streamed assistant text.
        payload:
          type: object
          required: [type, seq, text]
          properties:
            type: { const: text.delta }
            seq: { type: integer }
            text: { type: string }
      toolCallStart:
        name: tool.call.start
        summary: The agent started a tool call.
        payload:
          type: object
          required: [type, seq, toolCallId, toolName]
          properties:
            type: { const: tool.call.start }
            seq: { type: integer }
            toolCallId: { type: string }
            toolName: { type: string }
            input: { type: object }
            uiDescriptor:
              $ref: '#/components/schemas/ToolUIDescriptor'
      toolCallEnd:
        name: tool.call.end
        summary: Tool call finished.
        payload:
          type: object
          required: [type, seq, toolCallId, toolName]
          properties:
            type: { const: tool.call.end }
            seq: { type: integer }
            toolCallId: { type: string }
            toolName: { type: string }
            isError: { type: boolean }
            durationMs: { type: integer }
            uiDescriptor:
              $ref: '#/components/schemas/ToolUIDescriptor'
      toolCallProgress:
        name: tool.call.progress
        summary: >
          Incremental progress from a running tool (a "work line"). Long
          procedures narrate through these instead of going silent. Additive —
          consumers may ignore it.
        payload:
          type: object
          required: [type, seq, toolCallId, progress]
          properties:
            type: { const: tool.call.progress }
            seq: { type: integer }
            toolCallId: { type: string }
            progress: { type: string }
      permissionRequest:
        name: permission.request
        summary: >
          Run paused, awaiting an exact decision. Answer via POST
          /runs/{runId}/permissions/{requestId}/decision with the emitted
          operationHash.
        payload:
          type: object
          required: [type, seq, toolName, requestId, operationHash, intentRevision]
          properties:
            type: { const: permission.request }
            seq: { type: integer }
            toolName: { type: string }
            requestId: { type: string }
            operationHash: { type: string, pattern: '^[0-9a-f]{64}$' }
            intentRevision: { type: integer, const: 1 }
      sensitiveInputRequest:
        name: sensitive.input.request
        summary: >
          The run is waiting for one value through the dedicated opaque
          sensitive-input endpoint. The event contains metadata only; clients
          submit or deny by exact runId/requestId.
        payload:
          type: object
          required: [type, seq, requestId, toolCallId, toolName, label, usage, agentId, adapterRevision]
          properties:
            type: { const: sensitive.input.request }
            seq: { type: integer }
            requestId: { type: string }
            toolCallId: { type: string }
            toolName: { type: string }
            label: { type: string }
            usage: { type: string }
            agentId: { type: [string, 'null'] }
            adapterRevision: { type: string }
      sensitiveInputResponse:
        name: sensitive.input.response
        summary: Metadata-only terminal observation for one sensitive-input request.
        payload:
          type: object
          required: [type, seq, requestId, toolCallId, toolName, agentId, adapterRevision, status]
          properties:
            type: { const: sensitive.input.response }
            seq: { type: integer }
            requestId: { type: string }
            toolCallId: { type: string }
            toolName: { type: string }
            agentId: { type: [string, 'null'] }
            adapterRevision: { type: string }
            status: { type: string, enum: [injected, denied, failed, indeterminate] }
            reason:
              type: string
              enum: [adapter-unavailable, expired, revoked, binding-mismatch, injection-failed]
      skillActivation:
        name: skill.activation
        summary: >
          Content-free observation that an exact bound skill body entered a
          root or explicitly granted helper conversation. This is dispatcher
          evidence, not behavioral-compliance evidence.
        payload:
          type: object
          additionalProperties: false
          required: [type, seq, activationId, toolCallId, sourceRef, sourceDigest, skillName, skillDigest, agentId, turnIndex, timestamp]
          properties:
            type: { const: skill.activation }
            seq: { type: integer }
            activationId: { type: string, format: uuid }
            toolCallId: { type: [string, 'null'] }
            sourceRef: { type: string, minLength: 1, maxLength: 240 }
            sourceDigest: { type: string, pattern: '^hmac-sha256:[0-9a-f]{64}$' }
            skillName: { type: string, minLength: 1, maxLength: 240 }
            skillDigest: { type: string, pattern: '^hmac-sha256:[0-9a-f]{64}$' }
            agentId: { type: [string, 'null'] }
            turnIndex: { type: integer, minimum: 0 }
            timestamp: { type: integer, minimum: 0 }
      turnEnd:
        name: turn.end
        summary: >
          One model call finished. TERMINAL for the run unless
          stopReason is tool_use or pause_turn (the loop continues).
        payload:
          type: object
          required: [type, seq]
          properties:
            type: { const: turn.end }
            seq: { type: integer }
            stopReason: { type: string }
            usage:
              type: object
              properties:
                inputTokens: { type: integer, minimum: 0 }
                outputTokens: { type: integer, minimum: 0 }
                cacheReadTokens: { type: integer, minimum: 0 }
                cacheCreationTokens: { type: integer, minimum: 0 }
                reasoningTokens: { type: integer, minimum: 0 }
                cost: { type: number, minimum: 0 }
                usageAuthority: { type: string, enum: [provider_response, runtime_report] }
                costClassification: { type: string, enum: [estimated, provider_reported, subscription, local, unknown] }
                providerFacts:
                  type: object
                  properties:
                    requestId: { type: string }
                    generationId: { type: string }
                    servedModelId: { type: string }
                    servedProvider: { type: string }
                    servedTier: { type: string }
      turnInterrupted:
        name: turn.interrupted
        summary: Run ended outside turn.end (abort, timeout, shutdown). TERMINAL.
        payload:
          type: object
          required: [type, seq]
          properties:
            type: { const: turn.interrupted }
            seq: { type: integer }
            reason: { type: string }
      error:
        name: error
        summary: Something failed. TERMINAL.
        payload:
          type: object
          required: [type, seq, message]
          properties:
            type: { const: error }
            seq: { type: integer }
            code: { type: string }
            message: { type: string }
      streamShutdown:
        name: stream.shutdown
        summary: >
          Gateway is closing THIS socket (e.g. slow_consumer). TERMINAL
          for the connection — re-hydrate the run snapshot, then reconnect
          only if that run is still non-terminal.
        payload:
          type: object
          required: [type, seq]
          properties:
            type: { const: stream.shutdown }
            seq: { type: integer }
            reason: { type: string }
            retryAfterMs: { type: integer }
      heartbeat:
        name: heartbeat
        summary: Every ~30s regardless of traffic. Ignore; use for liveness timers.
        payload:
          type: object
          required: [type]
          properties:
            type: { const: heartbeat }
            ts: { type: integer }

components:
  schemas:
    ToolUIDescriptor:
      type: object
      additionalProperties: false
      required: [kind, summary]
      properties:
        kind:
          type: string
          enum: [file-write, file-read, file-edit, shell, search, image, external-action, conversational]
        summary:
          type: object
          additionalProperties: false
          required: [verb]
          properties:
            verb: { type: string, minLength: 1, maxLength: 120 }
            primaryField: { type: string, minLength: 1, maxLength: 120 }
            metaFields:
              type: array
              maxItems: 16
              items: { type: string, minLength: 1, maxLength: 120 }
        preview:
          type: object
          additionalProperties: false
          required: [contentField, format]
          properties:
            contentField: { type: string, minLength: 1, maxLength: 120 }
            format: { type: string, enum: [code, diff, markdown, plain, image-thumb] }
            truncateAtLines: { type: integer, minimum: 1, maximum: 10000 }
        openAction:
          type: object
          additionalProperties: false
          required: [target, pathField]
          properties:
            target: { type: string, enum: [file-pane, terminal-pane, image-pane, search-pane, url] }
            pathField: { type: string, minLength: 1, maxLength: 120 }

# The full engine vocabulary (thinking deltas, sub-agent spawns,
# compaction, security blocks, …) is larger; events not listed here are
# non-contractual — render them generically or ignore them.
